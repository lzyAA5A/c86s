; C86S = CardPuter86 / Serial
; 8086 PC emulator (Fake86) ported from M5Stack Cardputer (ESP32-S3) to a bare
; ESP32-D0WDQ6 (掌控板 2.0.4, 8 MB GD25Q64, no PSRAM, no TFT).
; Video goes out over UART0 as an RLE-compressed frame stream; the keyboard
; comes in over the same wire as PS/2 make/break scan codes.
; The PC-side counterpart is tools/c86host.py.

[platformio]
src_dir = src
default_envs = c86s

[env:c86s]
platform = espressif32@~6.5.0
board = esp32dev
framework = arduino

; --- target: ESP32 (LX6, dual core, 240 MHz), 8 MB flash, DIO @ 80 MHz -------
; DIO is mandatory: the reference build black-screens with QIO
; (rst:0x7 TG0WDT_SYS_RST).
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_upload.flash_size = 8MB
board_build.partitions = partitions_c86s.csv

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 921600

build_type = release
build_unflags = -Os
build_flags =
    -w
    -O2
    ; 解释器的 opcode 分发是一个巨型 switch，而 espressif32 平台默认塞了
    ; -fno-jump-tables -fno-tree-switch-conversion（省 flash，代价是每条
    ; 指令都退化成比较链）。这里把它们扳回来再量吞吐。
    -fjump-tables
    -ftree-switch-conversion
    -Isrc/emu
    -Isrc/serial
    -DCORE_DEBUG_LEVEL=0
    -DCARDPUTER86_NO_MODEM=1
    -DG86_CACHE_PAGES_MAX=32
    ; 客机内存 128 KB = 32 页 = 正好等于常驻页缓存上限 ⇒ 一个页都不会换出。
    ; 256 KB 要 64 页，缺的 32 页每页一次「擦+写 4KB」约 48 ms，POST 的内存
    ; 测试要多花十几秒（实测 20.3s 开机 vs 128KB 的 5s 级）。
    ; 想要 256 KB 就把下面这行改成 256（DOS 2.11 的最低要求是 128 KB）。
    -DG86_FORCE_RAMKB=256
; guest RAM: 256 KB machine (same ceiling as the reference build, gb_max_ram)
